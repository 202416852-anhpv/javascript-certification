<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Weather App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main>
      <section id="weather-info" class="weather-box">
        <p id="location">N/A</p>

        <div class="main-stats">
          <span id="main-temperature">N/A</span>
          <div>
            <img id="weather-icon" src="" alt="Weather Icon" />
            <span id="weather-main">N/A</span>
          </div>
        </div>

        <hr />

        <div class="main-weather-box">
          <div class="weather-detail">
            <p>Humidity: <span id="humidity">N/A</span></p>
            <p>Feels Like: <span id="feels-like">N/A</span></p>
            <p>Wind: <span id="wind">N/A</span></p>
            <p>Gusts: <span id="wind-gust">N/A</span></p>
          </div>

          <img id="clock" src="" alt="Clock Icon" />
        </div>
      </section>

      <section class="control-panel">
        <p>WEATHER FOR:</p>

        <div class="search-box">
          <select id="city-select">
            <option value=""></option>
            <option value="new york">New York</option>
            <option value="los angeles">Los Angeles</option>
            <option value="chicago">Chicago</option>
            <option value="paris">Paris</option>
            <option value="tokyo">Tokyo</option>
            <option value="london">London</option>
          </select>
        </div>

        <button id="get-weather-btn">Get Weather</button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
